name: publish-pypi
# PyPI Trusted Publishing (OIDC, no stored token). Pending publisher on pypi.org:
#   project airflow-provider-ttdu -> owner etacbae6768-a11y, repo ttdu-integrations,
#   workflow publish-pypi.yml, environment pypi
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Folder to publish'
        required: true
        type: choice
        options: [airflow-provider-ttdu]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build ${{ inputs.package }} --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
